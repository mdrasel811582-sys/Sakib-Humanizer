<!doctype html>
<html lang="bn"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Humanizer</title>
<style>
body{margin:0;font:16px/1.6 system-ui,sans-serif;background:#f4f5fb;color:#1b1d2a;padding:14px}
.c{max-width:700px;margin:auto}
textarea,input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd;border-radius:10px;font:inherit;margin:6px 0}
textarea{min-height:170px}
button{width:100%;padding:13px;border:0;border-radius:12px;background:#4f46e5;color:#fff;font:inherit;font-weight:700;margin-top:8px}
button.g{background:#e3e5ff;color:#222;font-weight:400}
#out{white-space:pre-wrap;background:#fff;border-radius:12px;padding:12px;margin-top:12px}
#st{color:#555;margin-top:8px}
#set{display:none;background:#fff;padding:12px;border-radius:12px;margin-bottom:10px}
small{color:#666}
</style></head><body><div class="c">
<h2>Humanizer</h2>
<button class="g" onclick="set.style.display=set.style.display=='block'?'none':'block'">⚙️ সেটিংস</button>
<div id="set">
<small>Gemini Key (aistudio.google.com/apikey)</small>
<input id="key" type="password" placeholder="AIza...">
<small>Groq Key (console.groq.com)</small>
<input id="gkey" type="password" placeholder="gsk_...">
<button onclick="sv()">সেভ</button></div>
<textarea id="inp" placeholder="AI-র লেখা এখানে পেস্ট করুন..."></textarea>
<select id="tone">
<option value="natural">স্বাভাবিক</option>
<option value="casual">ক্যাজুয়াল</option>
<option value="formal">ফরমাল</option>
<option value="academic">একাডেমিক</option></select>
<button id="go" onclick="run()">✨ হিউম্যানাইজ করুন</button>
<div id="st"></div>
<div id="out" style="display:none"></div>
<button class="g" id="cp" style="display:none" onclick="navigator.clipboard.writeText(out.textContent);this.textContent='✔ কপি হয়েছে'">📄 কপি</button>
</div>
<script>
var GM=["gemini-2.5-flash-lite","gemini-2.5-flash","gemini-flash-latest"];
var QM=["llama-3.3-70b-versatile","llama-3.1-8b-instant"];
key.value=localStorage.k||"";gkey.value=localStorage.q||"";
function sv(){localStorage.k=key.value.trim();localStorage.q=gkey.value.trim();set.style.display="none"}
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
async function call(a,sys,t){
 if(a.p=="g"){
  var r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+a.m+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":localStorage.k},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:[{role:"user",parts:[{text:t}]}],generationConfig:{temperature:1}})});
  var d=await r.json();
  if(!r.ok)return{s:r.status,e:(d.error&&d.error.message)||r.status};
  var p=d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts;
  return{t:p?p.map(function(x){return x.text||""}).join("").trim():""};
 }
 var r2=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+localStorage.q},body:JSON.stringify({model:a.m,temperature:1,messages:[{role:"system",content:sys},{role:"user",content:t}]})});
 var d2=await r2.json();
 if(!r2.ok)return{s:r2.status,e:(d2.error&&d2.error.message)||r2.status};
 return{t:((d2.choices&&d2.choices[0]&&d2.choices[0].message.content)||"").trim()};
}
async function run(){
 var t=inp.value.trim();
 if(!t){st.textContent="আগে লেখা দিন।";return}
 var L=[];
 if(localStorage.k)GM.forEach(function(m){L.push({p:"g",m:m})});
 if(localStorage.q)QM.forEach(function(m){L.push({p:"q",m:m})});
 if(!L.length){st.textContent="আগে সেটিংসে অন্তত একটা API Key দিন।";set.style.display="block";return}
 go.disabled=true;st.style.color="#555";
 var sys="Rewrite the user's text so it reads like a real person wrote it. Rules: same language as input, never translate; keep all facts, names, numbers unchanged; keep paragraph structure; vary sentence length a lot; use simple plain words; remove stock AI phrases and formulaic summaries; avoid overusing em dashes and lists of three. Tone: "+tone.value+". Output ONLY the rewritten text.";
 var last="অজানা সমস্যা";
 for(var i=0;i<L.length;i++){
  for(var n=0;n<2;n++){
   st.textContent="কাজ চলছে... ("+L[i].m+(n?", আবার চেষ্টা":"")+")";
   try{
    var res=await call(L[i],sys,t);
    if(res.t){out.textContent=res.t;out.style.display="block";cp.style.display="block";cp.textContent="📄 কপি";st.textContent="";go.disabled=false;return}
    if(res.e){last=L[i].m+": "+res.e;
     if(res.s==429||res.s>=500){await wait(1500);continue}
     break;}
    last=L[i].m+": খালি ফলাফল";
   }catch(e){last="ইন্টারনেট সংযোগে সমস্যা"}
   await wait(1000);
  }
 }
 st.style.color="#c62828";st.textContent="সব মডেল এখন ব্যস্ত বা Key ঠিক নেই। একটু পর আবার চাপুন। ("+last+")";
 go.disabled=false;
}
</script></body></html>
